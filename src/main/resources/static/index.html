<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>NEXUS Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script type="module" src="https://unpkg.com/picmo@latest/dist/index.js"></script>
</head>
<body class="bg-gray-100 h-screen flex flex-col overflow-hidden" style="background-image: url('https://www.transparenttextures.com/patterns/cubes.png');">

    <div class="navbar bg-green-600 text-white shadow-md z-20">
        <div class="flex-1 px-4 text-xl font-bold italic">NEXUS Chat</div>
    </div>

    <div id="chat-box" class="flex-1 overflow-y-auto p-6 space-y-6 bg-gray-50">
        </div>

    <div class="bg-green-700 p-4 border-t border-green-800">
        <div class="flex gap-3 max-w-4xl mx-auto relative items-center">
            
            <button id="emoji-trigger" class="btn btn-ghost text-2xl text-white">😊</button>
            <div id="emoji-picker" class="absolute bottom-16 left-0 hidden shadow-2xl z-50"></div>

            <label class="btn btn-ghost text-2xl text-white cursor-pointer">
                📎 <input type="file" id="file-input" class="hidden" onchange="enviarArchivo()">
            </label>

            <input type="text" id="msg" class="input input-bordered w-full bg-green-50 text-gray-800 focus:outline-none focus:ring-2 focus:ring-green-300" placeholder="Escribe un mensaje...">
            
            <button class="btn bg-blue-800 border-none hover:bg-blue-900 text-white px-8" onclick="enviar()">Enviar</button>
        </div>
    </div>

<script type="module">
    import { createPicker } from 'https://unpkg.com/picmo@latest/dist/index.js';
    
    // Lógica Emojis
    const picker = createPicker({ rootElement: document.querySelector('#emoji-picker') });
    const trigger = document.querySelector('#emoji-trigger');
    const input = document.querySelector('#msg');

    picker.addEventListener('emoji:select', selection => {
        input.value += selection.emoji;
        document.querySelector('#emoji-picker').classList.add('hidden');
    });
    trigger.addEventListener('click', () => document.querySelector('#emoji-picker').classList.toggle('hidden'));

    // Lógica Chat
    var socket = new SockJS('/chat');
    var stompClient = Stomp.over(socket);
    var miUsuario = "USUARIO-" + Math.floor(Math.random() * 999);

    window.renderizarMensaje = function(remitente, contenido, archivoBase64 = null) {
        var chatBox = document.getElementById('chat-box');
        var esPropio = (remitente === miUsuario);
        var avatarUrl = `https://api.dicebear.com/9.x/adventurer/svg?seed=${remitente}`;
        
        let mensajeContenido = contenido;
        if (archivoBase64) {
            mensajeContenido = `<div class="p-2 border-b border-gray-200">📎 <a href="${archivoBase64}" download="archivo" class="text-blue-600 underline">Descargar archivo</a></div><div>${contenido}</div>`;
        }

        chatBox.innerHTML += `
            <div class="chat ${esPropio ? 'chat-end' : 'chat-start'}">
                <div class="chat-image avatar">
                    <div class="w-10 rounded-full border border-blue-200 bg-white">
                        <img src="${avatarUrl}" />
                    </div>
                </div>
                <div class="chat-header text-xs text-blue-600 mb-1">${remitente}</div>
                <div class="chat-bubble ${esPropio ? 'bg-green-600 text-white' : 'bg-white text-black shadow-sm border border-gray-100'}">
                    ${mensajeContenido}
                </div>
            </div>`;
        chatBox.scrollTop = chatBox.scrollHeight;
    };

    window.enviarArchivo = function() {
        var fileInput = document.getElementById('file-input');
        var file = fileInput.files[0];
        if (file) {
            var reader = new FileReader();
            reader.onload = function(e) {
                stompClient.send("/app/chat.enviar", {}, JSON.stringify({ 
                    'remitente': miUsuario, 
                    'contenido': file.name,
                    'archivoBase64': e.target.result 
                }));
            };
            reader.readAsDataURL(file);
        }
    };

    window.enviar = function() {
        var input = document.getElementById('msg');
        if(input.value.trim() !== "") {
            stompClient.send("/app/chat.enviar", {}, JSON.stringify({ 
                'remitente': miUsuario, 
                'contenido': input.value 
            }));
            input.value = '';
        }
    };

    function cargarHistorial() {
        fetch('/api/historial')
            .then(response => response.json())
            .then(data => {
                data.forEach(msg => renderizarMensaje(msg.remitente, msg.contenido, msg.archivoBase64));
            });
    }

    window.onload = cargarHistorial;

    stompClient.connect({}, function () {
        stompClient.subscribe('/topic/mensajes', function (mensaje) {
            var body = JSON.parse(mensaje.body);
            renderizarMensaje(body.remitente, body.contenido, body.archivoBase64);
        });
    });
</script>
</body>
</html>
